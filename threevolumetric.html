<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volumetric Morphing Sphere</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
  <script>
    let scene, camera, renderer;
    let particles, geometry, material;
    const particleCount = 30000;
    const baseRadius = 200;
    const noise = new SimplexNoise();
    const originalPositions = new Float32Array(particleCount * 3);

    init();
    animate();

    function init() {
      // Scene & Camera
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
      camera.position.z = 400;

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // Particles Geometry
      geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);

      for (let i = 0; i < particleCount; i++) {
        // Random point on sphere surface
        const u = Math.random();
        const v = Math.random();
        const theta = 2 * Math.PI * u;
        const phi = Math.acos(2 * v - 1);
        const x = Math.sin(phi) * Math.cos(theta);
        const y = Math.sin(phi) * Math.sin(theta);
        const z = Math.cos(phi);

        // Store base direction
        originalPositions[i * 3] = x;
        originalPositions[i * 3 + 1] = y;
        originalPositions[i * 3 + 2] = z;

        // Initial placement
        positions[i * 3] = x * baseRadius;
        positions[i * 3 + 1] = y * baseRadius;
        positions[i * 3 + 2] = z * baseRadius;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      // Particles Material
      material = new THREE.PointsMaterial({
        size: 2.5,
        vertexColors: false,
        color: 0xffffff,
        transparent: true,
        opacity: 0.7
      });

      particles = new THREE.Points(geometry, material);
      scene.add(particles);

      // Handle Resize
      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      updateParticles();
      particles.rotation.y += 0.002;
      renderer.render(scene, camera);
    }

    function updateParticles() {
      const time = performance.now() * 0.0005;
      const positions = geometry.attributes.position.array;

      for (let i = 0; i < particleCount; i++) {
        const ox = originalPositions[i * 3];
        const oy = originalPositions[i * 3 + 1];
        const oz = originalPositions[i * 3 + 2];

        // Noise based radial offset
        const n = noise.noise3D(ox * 1.5 + time, oy * 1.5 + time, oz * 1.5 + time);
        const radius = baseRadius + n * 50;

        positions[i * 3]     = ox * radius;
        positions[i * 3 + 1] = oy * radius;
        positions[i * 3 + 2] = oz * radius;
      }

      geometry.attributes.position.needsUpdate = true;
    }
  </script>
</body>
</html>
